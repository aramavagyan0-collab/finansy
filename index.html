<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Финансы · Ֆինանսներ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
--bg: var(--tg-theme-bg-color, #111318);
--card: var(--tg-theme-secondary-bg-color, #1c1f26);
--text: var(--tg-theme-text-color, #f2f3f5);
--hint: var(--tg-theme-hint-color, #8b8f99);
--accent: var(--tg-theme-button-color, #5aa0ff);
--accent-text: var(--tg-theme-button-text-color, #ffffff);
--red: #ff4d6a; --green: #2fd18b;
--sep: rgba(140,140,150,.2);
--r: 16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Noto Sans Armenian",Arial,sans-serif;font-size:16px}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input{font:inherit;color:var(--text)}
.wrap{max-width:560px;margin:0 auto;padding:10px 14px 0}
.top{display:flex;gap:8px;align-items:stretch}
.sw{display:flex;background:var(--card);border-radius:12px;padding:3px;gap:3px}
.sw button{padding:8px 10px;border-radius:9px;font-size:14px;font-weight:600;color:var(--hint);white-space:nowrap}
.sw button.on{background:var(--accent);color:var(--accent-text)}
#ledger{flex:1} #ledger button{flex:1}
#lang button{padding:8px 8px;font-size:13px}
.head{position:relative;text-align:center;padding:16px 50px 6px}
.head .lbl{color:var(--hint);font-size:15px;display:inline-flex;gap:6px;align-items:center}
.head .bal{font-size:38px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.plus{position:absolute;right:0;top:24px;width:44px;height:44px;border-radius:22px;background:var(--accent);color:var(--accent-text);font-size:28px;line-height:44px}
.seg{display:flex;background:var(--card);border-radius:12px;padding:3px;gap:3px;margin-top:8px}
.seg button{flex:1;padding:7px 0;border-radius:9px;font-size:13.5px;color:var(--hint);font-weight:500}
.seg button.on{background:var(--bg);color:var(--text);font-weight:600}
.nav{display:flex;align-items:center;justify-content:space-between;margin:8px 0 6px}
.nav button{width:40px;height:36px;font-size:24px;color:var(--text)}
.nav button:disabled{opacity:.2}
.nav .pl{font-size:17px;font-weight:600;text-align:center;flex:1}
.kind{display:flex;background:var(--card);border-radius:var(--r);padding:6px;gap:6px;margin-bottom:12px}
.kind button{flex:1;border-radius:12px;padding:10px 4px;text-align:center}
.kind button.on{background:var(--bg)}
.kind .k1{font-size:14px;color:var(--hint)} .kind button.on .k1{color:var(--text)}
.kind .k2{font-size:24px;font-weight:700;margin-top:2px}
.red{color:var(--red)} .green{color:var(--green)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;align-items:center;gap:10px;border:1px solid var(--sep);border-radius:var(--r);padding:10px;text-align:left;min-width:0}
.ic{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;flex:0 0 46px}
.tile .tx{min-width:0;flex:1}
.tile .n{font-size:14.5px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .n.one{display:block;white-space:nowrap;text-overflow:ellipsis}
.tile .n.sm{font-size:12.5px}
.tile .ic{width:42px;height:42px;flex-basis:42px;font-size:22px}
.tile{gap:9px;padding:9px}
.tile .s{font-size:16px;color:var(--hint);margin-top:2px;white-space:nowrap}
.tile .s.has{color:var(--text);font-weight:600}
.tile.add{border-style:dashed;color:var(--hint);justify-content:center}
.sect{display:flex;justify-content:space-between;align-items:center;margin:16px 2px 10px;font-size:17px}
.acc{display:flex;align-items:center;gap:14px;border:1px solid var(--sep);border-radius:var(--r);padding:12px;margin-bottom:10px}
.acc .n{font-size:17px} .acc .s{font-size:18px;margin-top:2px;font-weight:600}
.btn{display:block;width:100%;background:var(--accent);color:var(--accent-text);border-radius:12px;padding:14px;font-weight:600;font-size:16px;margin-top:10px}
.btn.sec{background:var(--card);color:var(--accent)}
.btn.del{background:var(--card);color:var(--red)}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--hint)}
.chartrow{display:flex;align-items:center;gap:14px}
.chartrow svg{flex:0 0 132px}
.legend{flex:1;min-width:0}
.cat-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--sep)}
.cat-row:last-child{border-bottom:0}
.dot{width:10px;height:10px;border-radius:5px;flex:0 0 10px}
.nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.pc{color:var(--hint);font-size:13px;width:38px;text-align:right}
.am{font-weight:600;font-size:15px;text-align:right;white-space:nowrap}
.bar{height:4px;border-radius:2px;background:var(--sep);margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:2px}
.sum3{display:flex;gap:8px}
.sum3 div{flex:1;text-align:center}
.sum3 .a{font-size:12px;color:var(--hint)} .sum3 .b{font-size:17px;font-weight:700;margin-top:2px}
.day{font-size:13px;color:var(--hint);font-weight:600;margin:14px 2px 6px;display:flex;justify-content:space-between}
.list{background:var(--card);border-radius:var(--r);padding:0 12px}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--sep);width:100%;text-align:left}
.item:last-child{border-bottom:0}
.item .ic{width:40px;height:40px;flex-basis:40px;font-size:20px;border-radius:11px}
.item .mid{flex:1;min-width:0}
.item .t1{font-size:15px}
.item .t2{font-size:13px;color:var(--hint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .amt{font-weight:600;white-space:nowrap}
.empty{text-align:center;color:var(--hint);padding:36px 10px;font-size:15px;line-height:1.4}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);display:flex;justify-content:space-around;
padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:6;border-top:1px solid var(--sep)}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--hint);padding:4px 0;min-width:0}
.tabs button span{white-space:normal;text-align:center;line-height:1.1;max-width:100%;hyphens:manual}
.tabs svg{width:24px;height:24px;padding:2px 14px;box-sizing:content-box;border-radius:14px}
.tabs button.on{color:var(--accent)}
.tabs button.on svg{background:rgba(127,160,255,.18)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.ov.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-radius:18px 18px 0 0;z-index:11;
transform:translateY(105%);transition:transform .25s ease;max-height:94vh;overflow-y:auto;
padding:10px 14px calc(18px + env(safe-area-inset-bottom))}
.sheet.show{transform:none}
.sheet .in{max-width:560px;margin:0 auto}
.grab{width:38px;height:5px;border-radius:3px;background:var(--sep);margin:0 auto 10px}
.sh-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px}
.sh-title b{font-size:17px;text-align:center;flex:1}
.sh-title button,.sh-title span{color:var(--accent);font-size:16px;min-width:76px}
.sh-title .r{text-align:right}
.badge{display:block;text-align:center;font-size:12px;color:var(--hint);margin-bottom:6px}
.amount{text-align:center;font-size:42px;font-weight:700;padding:4px 0 2px;min-height:58px;letter-spacing:-.5px}
.amount.zero{color:var(--hint)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips .lb{font-size:13px;color:var(--hint);align-self:center;white-space:nowrap;margin-right:2px;position:sticky;left:0;background:var(--bg);padding:8px 6px 8px 0;z-index:1}
.chip{background:var(--card);border-radius:18px;padding:7px 12px;font-size:14px;white-space:nowrap;border:2px solid transparent}
.chip.sel{border-color:var(--accent)}
.meta{display:flex;gap:8px;margin:4px 0 10px}
.meta input{flex:1;min-width:0;background:var(--card);border:0;border-radius:10px;padding:10px 12px;outline:none}
.meta input[type=date]{flex:0 0 auto;max-width:150px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.pad button{background:var(--card);border-radius:12px;height:48px;font-size:22px;font-weight:500}
.pad button:active{opacity:.6}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cats button{background:var(--card);border-radius:12px;padding:9px 3px;display:flex;flex-direction:column;align-items:center;gap:4px;
font-size:11.5px;line-height:1.15;min-height:70px;border:2px solid transparent;word-break:break-word;text-align:center}
.cats button .e{font-size:24px}
.cats button.sel{border-color:var(--accent)}
.hint{font-size:13px;color:var(--hint);text-align:center;margin:8px 0}
.row{display:flex;align-items:center;gap:10px;background:var(--card);padding:10px 12px;border-radius:12px;margin-bottom:8px}
.row input{border:0;background:transparent;outline:none;min-width:0}
.row .emi{width:44px;text-align:center;font-size:22px;background:var(--bg);border-radius:8px;padding:4px 0}
.row .nmi{flex:1}
.row .sti{width:90px;text-align:right;background:var(--bg);border-radius:8px;padding:4px 6px}
.row .x{color:var(--red);font-size:20px;width:28px}
.sec-t{font-size:13px;color:var(--hint);text-transform:uppercase;font-weight:600;letter-spacing:.4px;margin:18px 2px 8px}
.mrow{display:flex;justify-content:space-between;align-items:center;background:var(--card);padding:14px;border-radius:12px;margin-bottom:8px;width:100%;text-align:left}
.mrow .v{color:var(--hint)}
textarea{width:100%;min-height:120px;border-radius:12px;border:0;background:var(--card);color:var(--text);padding:10px;font:13px/1.4 ui-monospace,Menlo,monospace}
.toast{position:fixed;left:50%;top:16px;transform:translate(-50%,-90px);background:rgba(40,40,45,.95);color:#fff;
padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;transition:transform .25s;max-width:90vw;text-align:center}
.toast.show{transform:translate(-50%,0)}
.sync{font-size:11px;color:var(--hint);text-align:center;margin:12px 0 0}
</style>
</head>

<div class="sw" id="ledger"><button data-l="p"></button><button data-l="b"></button></div>

</div>

</nav>
<div class="ov" id="ov"></div>
<div class="sheet" id="sheet"><div class="in" id="sheetIn"></div></div>
<div class="toast" id="toast"></div>

if(x.k==='e'||x.k==='i'){ catn=nm(catIn(x.c,L)); if(x.k==='e') amt=-x.a; }
else if(x.k==='d'){ const dd=findDebt(x.c); catn=dd?nm(dd.d):'—'; amt=-x.a; }
else { accn=an(x.acc)+' → '+an(x.c); }
rows.push([x.d.slice(0,7), x.d, t[L+'N'], ty[x.k]||x.k, catn, accn, amt, x.t||'']);
});
});
return rows.sort((a,b)=>a[1]<b[1]?-1:a[1]>b[1]?1:0);
}
function scheduleSync(){ if(!state.cfg.gs||!state.loaded) return; clearTimeout(scheduleSync._t); scheduleSync._t=setTimeout(()=>syncSheets(false),2500); }
function syncSheets(manual){
const t=T(), url=state.cfg.gs; if(!url) return;
if(!state.cfg.gk){ state.cfg.gk=uid()+uid(); saveCfg(); }
const rows=exportRows('all'), months={}, sumRows={};
rows.forEach(r=>{ const m=r[0]; const o=sumRows[m]||(sumRows[m]={pi:0,pe:0,bi:0,be:0,ni:0,ne:0});
const L=r[2]===t.pN?'p':'b', x=r[3];
if(x===t.incOne){ o[L+'i']+=r[6]; } else if(x===t.expOne||x===t.debtPay){ o[L+'e']+=-r[6]; } });
// net excluding cross transfers
LS2.forEach(L=>state.L[L].items.forEach(x=>{ if(x.x) return; const o=sumRows[x.d.slice(0,7)]; if(!o) return; if(x.k==='i') o.ni+=x.a; else if(x.k==='e'||x.k==='d') o.ne+=x.a; }));
Object.keys(sumRows).forEach(m=>{ const o=sumRows[m];
months[m]=[['👤 '+t.inc,o.pi],['👤 '+t.exp,-o.pe],['🏢 '+t.inc,o.bi],['🏢 '+t.exp,-o.be],['Σ '+t.diff,o.ni-o.ne]]; });
const summary=[[t.month,'👤 '+t.inc,'👤 '+t.exp,'🏢 '+t.inc,'🏢 '+t.exp,'Σ '+t.diff]].concat(Object.keys(sumRows).sort().reverse().map(m=>{ const o=sumRows[m]; return [m,o.pi,-o.pe,o.bi,-o.be,o.ni-o.ne]; }));
const payload={key:state.cfg.gk, cur:state.cfg.cur, labels:{head:t.gsHead, summary:t.summary}, rows:rows.map(r=>[r[0],r[1],r[2],r[3],r[4],r[5],r[6],r[7]]), months, summary};
fetch(url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)})
.then(()=>{ if(manual){ toast(t.gsSent); setTimeout(checkSheets,4000); } })
.catch(()=>{ if(manual) toast(t.gsBad); });
}

sc.onerror=()=>done(t.gsBad);
sc.src=url+(url.includes('?')?'&':'?')+'key='+encodeURIComponent(state.cfg.gk||'')+'&callback='+cb;

toast((isNew?t.saved:t.changed)+': '+fmt(a));
